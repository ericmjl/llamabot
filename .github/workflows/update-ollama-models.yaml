name: Update Ollama Models

on:
  schedule:
    # Run daily at 3 PM UTC
    - cron: '0 15 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write
  actions: write # dispatch pr-tests and approve parked pull_request runs

jobs:
  update-ollama-models:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Update Ollama models
        run: |
          uv run scripts/autoupdate_ollama_models.py

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        id: create_pull_request
        if: steps.check_changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update Ollama models list"
          title: "chore: update Ollama models list"
          body: |
            This PR was automatically created by the daily Ollama models update workflow.

            Changes:
            - Updated `llamabot/bot/ollama_model_names.txt` with the latest models from https://ollama.ai/library

            If auto-merge is enabled for this repository, this PR will be
            automatically merged once mergeable; otherwise it awaits manual
            review and merge.
          branch: update-ollama-models
          delete-branch: true

      - name: Approve workflow runs parked pending approval
        # PRs opened with GITHUB_TOKEN park pull_request workflows at
        # action_required. A parked run reports no check runs, and a
        # workflow_dispatch of pr-tests is not credited toward the PR's
        # required checks (release PR #399). Approve the parked runs so
        # the ruleset sees real results. actions: write is set above.
        if: steps.check_changes.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          HEAD_SHA="${{ steps.create_pull_request.outputs.pull-request-head-sha }}"
          if [ -z "$HEAD_SHA" ]; then
            echo "::warning::No pull request head SHA; cannot approve parked workflow runs."
            exit 0
          fi
          # The approval may race PR creation, so poll briefly before giving up.
          RUN_IDS=""
          for ATTEMPT in $(seq 1 10); do
            RUN_IDS=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=$HEAD_SHA&status=action_required" --jq '.workflow_runs[].id' 2>/dev/null || true)
            if [ -n "$RUN_IDS" ]; then break; fi
            sleep 15
          done
          if [ -z "$RUN_IDS" ]; then
            echo "No action_required workflow runs found on $HEAD_SHA; continuing."
            exit 0
          fi
          APPROVED=false
          for RUN_ID in $RUN_IDS; do
            if gh api -X POST "repos/${{ github.repository }}/actions/runs/$RUN_ID/approve" >/dev/null 2>&1; then
              echo "✓ Approved workflow run $RUN_ID"
              APPROVED=true
            else
              echo "::warning::Could not approve workflow run $RUN_ID. If auto-merge stalls, approve the pending run on the models PR manually."
            fi
          done
          if [ "$APPROVED" != "true" ]; then
            echo "::warning::Self-approval appears blocked; a maintainer may need to approve the parked run on the models PR."
          fi

      - name: Trigger CI on the PR branch
        # Dispatch is belt-and-braces only. Required checks come from the
        # approved pull_request run above; a workflow_dispatch run is not
        # credited toward the PR ruleset.
        if: steps.check_changes.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh workflow run pr-tests.yaml --ref update-ollama-models; then
            echo "::warning::Could not dispatch pr-tests on update-ollama-models."
          fi

      - name: Enable auto-merge
        if: steps.check_changes.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the PR number from the create-pull-request step
          PR_URL=$(gh pr list --head update-ollama-models --json url --jq '.[0].url')
          if [ -n "$PR_URL" ]; then
            # This repository only allows rebase merges.
            # If auto-merge is disabled at the repo level, leave the PR open
            # for manual merge instead of failing the workflow.
            if ! gh pr merge "$PR_URL" --auto --rebase; then
              echo "::warning::Auto-merge is unavailable; leaving PR for manual merge: $PR_URL"
            fi
          fi
