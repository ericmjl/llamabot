name: Update Ollama Models

on:
  schedule:
    # Run daily at 3 PM UTC
    - cron: '0 15 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write
  actions: write # needed to dispatch the test workflow on the bot branch

jobs:
  update-ollama-models:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Update Ollama models
        run: |
          uv run scripts/autoupdate_ollama_models.py

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.check_changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update Ollama models list"
          title: "chore: update Ollama models list"
          body: |
            This PR was automatically created by the daily Ollama models update workflow.

            Changes:
            - Updated `llamabot/bot/ollama_model_names.txt` with the latest models from https://ollama.ai/library

            If auto-merge is enabled for this repository, this PR will be
            automatically merged once mergeable; otherwise it awaits manual
            review and merge.
          branch: update-ollama-models
          delete-branch: true

      - name: Trigger CI on the PR branch
        # Pushes made with GITHUB_TOKEN do not trigger workflow runs, so the
        # required checks on the bot's PR would never report and auto-merge
        # would stall. Dispatch the test workflow on the PR branch explicitly.
        if: steps.check_changes.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh workflow run pr-tests.yaml --ref update-ollama-models; then
            echo "::warning::Could not dispatch pr-tests on update-ollama-models; CI will not run on the bot PR."
          fi

      - name: Enable auto-merge
        if: steps.check_changes.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the PR number from the create-pull-request step
          PR_URL=$(gh pr list --head update-ollama-models --json url --jq '.[0].url')
          if [ -n "$PR_URL" ]; then
            # This repository only allows rebase merges.
            # If auto-merge is disabled at the repo level, leave the PR open
            # for manual merge instead of failing the workflow.
            if ! gh pr merge "$PR_URL" --auto --rebase; then
              echo "::warning::Auto-merge is unavailable; leaving PR for manual merge: $PR_URL"
            fi
          fi
